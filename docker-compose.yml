services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corvo
      POSTGRES_USER: corvo
      POSTGRES_PASSWORD: corvo
    ports:
      - "5433:5432"
    volumes:
      - corvo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvo -d corvo"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai:
    build:
      context: .
      dockerfile: deploy/ai.Dockerfile
    environment:
      CORVO_AI_TOKEN: local-dev-token
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/corvo
      SPRING_DATASOURCE_USERNAME: corvo
      SPRING_DATASOURCE_PASSWORD: corvo
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      CORVO_AI_BASE_URL: http://ai:8000
      CORVO_AI_TOKEN: local-dev-token
      CORVO_SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  corvo_pgdata:
