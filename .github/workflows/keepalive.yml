name: Keep Render services warm

on:
  schedule:
    # GitHub may delay scheduled runs; 10 minutes leaves margin before Render's 15-minute idle limit.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping frontend and backend
        run: curl --fail --silent --show-error --max-time 120 https://cantillcantill-web.onrender.com/api/health

      # Remove this step if you want to conserve the workspace's 750 free instance hours.
      - name: Ping AI service
        run: curl --fail --silent --show-error --max-time 120 https://cantill-ai.onrender.com/health
